<html>
    <head>
        <title>
            sbJS
        </title>
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/prismjs@1.30.0/themes/prism-tomorrow.min.css">
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <div style="
            display: grid;
            grid-template-rows: max-content 1fr;
            height: 100%;
            box-sizing: border-box;
            overflow: hidden;">
            <div style="
                display: grid;
                grid-template-columns: repeat(6, max-content) 1fr max-content;
                border-bottom: 1px solid #555;
                overflow: hidden;">
                <div style="
                    display: flex;
                    align-items: center;
                    justify-content: center;
                    padding: 1rem;
                    font-size: 1.5rem;
                    font-weight: bold;">
                    sbJS
                </div>
                <div style="
                    display: flex;
                    align-items: center;
                    padding: 1rem;
                    cursor: pointer;"
                    id="btnNew">
                    New
                </div>
                <div style="
                    display: flex;
                    align-items: center;
                    padding: 1rem;
                    cursor: pointer;"
                    id="btnOpen">
                    Open
                </div>
                <div style="
                    display: flex;
                    align-items: center;
                    padding: 1rem;
                    cursor: pointer;"
                    id="btnSave">
                    Save
                </div>
                <div style="
                    display: flex;
                    align-items: center;
                    padding: 1rem;
                    cursor: pointer;"
                    id="btnRender">
                    Render
                </div>
                <div style="
                    display: flex;
                    align-items: center;
                    padding: 1rem;
                    cursor: pointer;"
                    id="btnHelp">
                    Help
                </div>
                <div></div>
                <div style="
                    display: flex;
                    align-items: center;
                    padding: 1rem;
                    font-size: 0.7rem;
                    color: #aaa;">
                    &copy; 2026 ionvop
                </div>
            </div>
            <div style="
                display: grid;
                grid-template-columns: 1fr 3px 2fr;
                overflow: hidden;">
                <div style="
                    display: grid;
                    grid-template-rows: 3fr 3px 1fr;
                    overflow: hidden;">
                    <div style="
                        overflow: hidden;
                        padding: 1rem;">
                        <div style="
                            height: 100%;
                            font-family: monospace;"
                            id="inputEditor"></div>
                    </div>
                    <div style="
                        background-color: #555;
                        cursor: ns-resize;"
                        id="splitCode">
                    </div>
                    <div style="
                        padding: 1rem;
                        overflow: auto;
                        color: #aaa;
                        font-family: monospace;
                        white-space: pre-wrap;"
                        id="panelStatus"></div>
                </div>
                <div style="
                    background-color: #555;
                    cursor: ew-resize;"
                    id="splitColumn">
                </div>
                <div style="
                    display: grid;
                    grid-template-rows: 2fr 3px 1fr;
                    overflow: hidden;">
                    <div style="
                        display: grid;
                        grid-template-rows: 1fr max-content;
                        overflow: hidden;">
                        <div style="
                            padding: 1rem;
                            border-bottom: 1px solid #555;">
                            <div style="
                                display: flex;
                                justify-content: center;
                                align-items: center;
                                height: 100%;
                                box-sizing: border-box;"
                                id="panelContainer">
                                <canvas style="
                                    background-color: #fff;
                                    border-radius: 1rem;"
                                    width="16"
                                    height="9"
                                    id="canvasRender">
                                </canvas>
                            </div>
                        </div>
                        <div style="
                            padding: 1rem;">
                            <audio style="
                                width: 100%;"
                                src=""
                                controls
                                id="audMusic">
                            </audio>
                        </div>
                    </div>
                    <div style="
                        background-color: #555;
                        cursor: ns-resize;"
                        id="splitRow">
                    </div>
                    <div style="
                        display: grid;
                        grid-template-columns: max-content 1fr;
                        overflow: hidden;">
                        <div style="
                            display: grid;
                            grid-template-rows: repeat(2, max-content) 1fr;
                            border-right: 1px solid #555;
                            overflow: hidden;">
                            <div style="
                                padding: 1rem;
                                border-bottom: 1px solid #555;
                                cursor: pointer;"
                                title="Upload music"
                                id="btnMusic">
                                <svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px" fill="#e3e3e3"><path d="M127-167q-47-47-47-113t47-113q47-47 113-47 23 0 42.5 5.5T320-418v-308q0-15 9.5-26.5T353-766l400-66q18-3 32.5 8.5T800-793v433q0 66-47 113t-113 47q-66 0-113-47t-47-113q0-66 47-113t113-47q23 0 42.5 5.5T720-498v-165l-320 63v320q0 66-47 113t-113 47q-66 0-113-47Z"/></svg>
                            </div>
                            <div style="
                                padding: 1rem;
                                border-bottom: 1px solid #555;
                                cursor: pointer;"
                                title="Upload new sprite"
                                id="btnNewSprite">
                                <svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px" fill="#e3e3e3"><path d="M200-120q-33 0-56.5-23.5T120-200v-560q0-33 23.5-56.5T200-840h560q33 0 56.5 23.5T840-760v560q0 33-23.5 56.5T760-120H200Zm80-160h400q12 0 18-11t-2-21L586-459q-6-8-16-8t-16 8L450-320l-74-99q-6-8-16-8t-16 8l-80 107q-8 10-2 21t18 11Z"/></svg>
                            </div>
                            <div></div>
                        </div>
                        <div style="
                            padding: 1rem;
                            overflow-y: auto;"
                            id="panelSprites">

                        </div>
                    </div>
                </div>
            </div>
        </div>
        <script src="https://cdn.jsdelivr.net/npm/split-grid@1.0.11/dist/split-grid.min.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/codejar-compat@3.2.2/dist/codejar.umd.min.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/prismjs@1.30.0/prism.min.js"></script>
        <script src="classes.js"></script>
        <script src="script.js"></script>
    </body>
</html>
